<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة العملاء والموردين — شركة التكعيب المعماري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --panel-2:#f8fafc; --border:#e3e8ef;
  --text:#1c2b3a; --text-dim:#5b6b7c; --text-faint:#8695a5;
  --accent:#286090; --accent-2:#1f4c73; --accent-soft:#e8f0f7;
  --green:#1e8a5f; --green-soft:#e6f5ee;
  --amber:#b7791f; --amber-soft:#fbf1e0;
  --red:#c0392b; --red-soft:#fbeae8;
  --purple:#6c4fa1; --purple-soft:#f0ebf8;
  --shadow:0 1px 3px rgba(20,30,45,.06), 0 1px 2px rgba(20,30,45,.08);
  --radius:12px; --radius-sm:8px;
  --font:'IBM Plex Sans Arabic', Tahoma, Arial, sans-serif;
}
html.dark{
  --bg:#111a24; --panel:#17212c; --panel-2:#1c2733; --border:#2a3644;
  --text:#e7edf3; --text-dim:#a7b4c2; --text-faint:#7c8a99;
  --accent:#5b9bd5; --accent-2:#7db0e0; --accent-soft:#1e3245;
  --green:#4caf82; --green-soft:#173226;
  --amber:#dba552; --amber-soft:#3a2f16;
  --red:#e07766; --red-soft:#3a1f1c;
  --purple:#a888d6; --purple-soft:#2a2038;
  --shadow:0 1px 3px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);transition:background .2s,color .2s;}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px;}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.brand{display:flex;flex-direction:column;gap:2px;}
.brand h1{font-size:17px;margin:0;font-weight:700;}
.brand span{font-size:12px;color:var(--text-dim);}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--panel);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);font-size:17px;
  box-shadow:var(--shadow);}
.iconbtn:hover{background:var(--panel-2);}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:5px;
  box-shadow:var(--shadow);width:fit-content;}
.tab{padding:9px 22px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;color:var(--text-dim);user-select:none;}
.tab.active{background:var(--accent);color:#fff;}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0;}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
.kpi .lbl{font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
.kpi .val{font-size:21px;font-weight:700;}
.kpi .sub{font-size:11.5px;color:var(--text-faint);margin-top:4px;}
.kpi.warn .val{color:var(--amber);}
.kpi .bar{height:6px;border-radius:4px;background:var(--panel-2);margin-top:8px;overflow:hidden;}
.kpi .bar i{display:block;height:100%;background:var(--accent);}

/* insight strip */
.insight{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:var(--text);margin-bottom:16px;}
.insight b{color:var(--accent-2);}
.insight.risk{background:var(--red-soft);}
.insight.risk b{color:var(--red);}

/* controls */
.controls{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.search{flex:1;min-width:220px;position:relative;}
.search input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font-family:var(--font);font-size:13.5px;}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px;}
.seg{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.seg button{border:none;background:transparent;color:var(--text-dim);padding:9px 16px;font-size:13px;cursor:pointer;font-family:var(--font);font-weight:600;}
.seg button.active{background:var(--accent);color:#fff;}
.count-pill{font-size:12px;color:var(--text-faint);padding:0 4px;}

/* list */
.list{display:flex;flex-direction:column;gap:8px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;}
.row:hover{background:var(--panel-2);}
.row .idx{width:22px;font-size:11px;color:var(--text-faint);flex-shrink:0;}
.row .info{flex:1;min-width:0;}
.row .name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .code{font-size:11px;color:var(--text-faint);margin-top:1px;}
.row .aging{width:150px;flex-shrink:0;display:none;}
.row .aging .bar2{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--panel-2);}
.row .aging .bar2 span{height:100%;}
.row .amt{width:150px;text-align:left;flex-shrink:0;}
.row .amt .num{font-size:15px;font-weight:700;}
.row .amt .lbl2{font-size:10.5px;color:var(--text-faint);}
.row .chev{width:16px;color:var(--text-faint);font-size:12px;flex-shrink:0;transition:transform .15s;}
.card.open .chev{transform:rotate(90deg);}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;}
.badge.settled{background:var(--green-soft);color:var(--green);}
.badge.outstanding{background:var(--amber-soft);color:var(--amber);}
.badge.prepaid{background:var(--purple-soft);color:var(--purple);}
.badge.dual{background:var(--accent-soft);color:var(--accent-2);margin-inline-start:6px;}

@media(min-width:720px){.row .aging{display:block;}}

/* statement panel */
.statement{display:none;border-top:1px solid var(--border);background:var(--panel-2);padding:14px 16px 18px;}
.card.open .statement{display:block;}
.stm-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.stm-head .meta{font-size:12px;color:var(--text-dim);}
.dlbtn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:9px;font-size:13px;
  font-weight:600;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:6px;}
.dlbtn:hover{background:var(--accent-2);}
.stm-table-wrap{max-height:360px;overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--panel);}
table.stm{width:100%;border-collapse:collapse;font-size:12.5px;}
table.stm th{position:sticky;top:0;background:var(--panel-2);color:var(--text-dim);text-align:right;
  padding:8px 10px;font-weight:700;border-bottom:1px solid var(--border);}
table.stm td{padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.stm td.desc{white-space:normal;}
table.stm tr.opening td,table.stm tr.closing td{font-weight:700;background:var(--panel-2);}
table.stm td.num{font-variant-numeric:tabular-nums;text-align:left;}
.pill-manual{font-size:9.5px;background:var(--green-soft);color:var(--green);padding:1px 6px;border-radius:20px;margin-inline-start:5px;font-weight:600;}

/* add entry inline form */
.add-entry{margin:6px 0 12px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.add-entry-title{font-size:12px;font-weight:700;color:var(--text-dim);margin-bottom:9px;display:flex;align-items:center;gap:6px;}
.add-entry-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.add-entry-row input{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);color:var(--text);font-family:var(--font);font-size:13px;}
.add-entry-row input.amt-in{width:140px;font-variant-numeric:tabular-nums;text-align:left;}
.add-entry-row input.date-in{width:150px;}
.add-entry-row input.desc-in{flex:1;min-width:180px;}
.add-entry-row input:focus{outline:2px solid var(--accent);outline-offset:-1px;}
.add-btn{background:var(--green);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;
  font-weight:600;cursor:pointer;font-family:var(--font);}
.add-btn:hover{filter:brightness(1.05);}
.add-note{font-size:11px;color:var(--text-faint);margin-top:6px;}
tr.manual td{background:var(--green-soft);}
html.dark tr.manual td{background:rgba(76,175,130,.10);}
.reset-manual{background:transparent;color:var(--red);border:none;font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0;}

/* aging detail block (in expanded statement) */
.aging-detail{margin:4px 0 14px;}
.aging-detail-title{font-size:12px;font-weight:700;color:var(--text-dim);margin-bottom:8px;}
.age-chips{display:flex;gap:10px;flex-wrap:wrap;}
.age-chip{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--border);
  border-radius:10px;padding:9px 13px;min-width:135px;box-shadow:var(--shadow);}
.age-chip .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.age-lbl{font-size:11px;color:var(--text-faint);margin-bottom:2px;}
.age-val{font-size:13.5px;font-weight:700;}
.age-pct{font-size:10.5px;color:var(--text-faint);font-weight:500;}

.empty{padding:40px;text-align:center;color:var(--text-faint);font-size:13px;}
footer{margin-top:26px;text-align:center;font-size:11.5px;color:var(--text-faint);}

@media(max-width:720px){
  .kpis{grid-template-columns:repeat(2,1fr);}
  .row .amt{width:110px;}
}
/* print statement */
.print-doc{display:none;}
@media print{
  body > *{display:none !important;}
  body > #printArea{display:block !important;}
  #printArea{margin:0;padding:0;}
  .print-doc{display:block;font-family:Arial, Tahoma, sans-serif;color:#111;padding:8mm 10mm;}
  .print-hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #286090;padding-bottom:8px;margin-bottom:10px;}
  .print-hd h2{margin:0 0 4px;font-size:16px;}
  .print-hd h3{margin:0 0 4px;font-size:15px;color:#286090;}
  .print-hd div{font-size:11px;color:#444;}
  .print-meta{display:flex;gap:24px;font-size:12px;margin-bottom:10px;flex-wrap:wrap;}
  table.print-table{width:100%;border-collapse:collapse;font-size:11px;page-break-inside:auto;}
  table.print-table thead{display:table-header-group;}
  table.print-table tr{page-break-inside:avoid;}
  table.print-table th{background:#eef2f7;text-align:right;padding:5px 7px;border:1px solid #ccc;}
  table.print-table td{padding:5px 7px;border:1px solid #ddd;}
  .print-summary{margin-top:12px;font-size:13px;font-weight:bold;text-align:left;}
  .print-ftr{margin-top:16px;font-size:9.5px;color:#888;text-align:center;border-top:1px solid #ddd;padding-top:6px;}
  @page{margin:10mm;}
}
</style>
</head>

<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('data-json').textContent);

  function cssEscape(s){
    if(typeof CSS !== 'undefined' && CSS.escape) return CSS.escape(s);
    return String(s).replace(/([^\w-])/g, '\\$1');
  }

  var state = { tab: 'customers', q: '', filter: 'all', openCards: {} };
  var MANUAL_KEY = 'atk_manual_entries_v1';

  // ---------- manual entries (persisted per account) ----------
  function loadManual(){
    try{ return JSON.parse(localStorage.getItem(MANUAL_KEY) || '{}'); }
    catch(e){ return {}; }
  }
  function saveManual(m){
    try{ localStorage.setItem(MANUAL_KEY, JSON.stringify(m)); }catch(e){}
  }
  function getEntries(acctNo){ var m = loadManual(); return m[acctNo] || []; }
  function addEntry(acctNo, entry){
    var m = loadManual(); if(!m[acctNo]) m[acctNo] = [];
    entry.id = 'm' + Date.now() + Math.floor(Math.random()*1000);
    m[acctNo].push(entry); saveManual(m); return entry.id;
  }
  function removeEntry(acctNo, id){
    var m = loadManual(); if(!m[acctNo]) return;
    m[acctNo] = m[acctNo].filter(function(e){ return e.id !== id; });
    if(m[acctNo].length===0) delete m[acctNo];
    saveManual(m);
  }
  function parseDateInput(s){
    // accept dd/mm/yyyy or yyyy-mm-dd
    var m = /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/.exec(s||'');
    if(m) return { iso: m[3]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0'),
                   disp: String(+m[1]).padStart(2,'0')+'/'+String(+m[2]).padStart(2,'0')+'/'+m[3] };
    m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s||'');
    if(m) return { iso: m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0'),
                   disp: String(+m[3]).padStart(2,'0')+'/'+String(+m[2]).padStart(2,'0')+'/'+m[1] };
    return null;
  }
  function todayInput(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  // returns an account view that includes manual entries applied
  function effective(acc){
    var entries = getEntries(primaryCode(acc));
    if(entries.length===0){
      // still recompute a bare "manualCount" tag for uniformity
      var v = Object.assign({}, acc);
      v.manualCount = 0; v.effectiveTxns = acc.txns.slice();
      v.effectiveBalance = acc.balance; v.effectiveSettled = acc.settled;
      v.effectiveTotalDebit = acc.total_debit; v.effectiveTotalCredit = acc.total_credit;
      v.effectiveAging = acc.aging;
      return v;
    }
    var v = Object.assign({}, acc);
    // build effective transactions in chronological order
    var extraTxns = entries.map(function(e){
      // customer view: collection => credit; supplier view: payment => debit
      var isCust = (acc.home === 'customer');
      var t = { date: e.date_disp, date_iso: e.date_iso, desc: e.desc, inferred: false, manual: true, manual_id: e.id, source: acc.home };
      if(isCust){ t.credit = e.amount; t.debit = null; } else { t.debit = e.amount; t.credit = null; }
      return t;
    });
    var merged = acc.txns.concat(extraTxns).slice();
    merged.sort(function(a,b){
      var da = a.date_iso || '2100-01-01', db = b.date_iso || '2100-01-01';
      if(da !== db) return da < db ? -1 : 1;
      // put manual entries after original ones on the same date
      return (a.manual?1:0) - (b.manual?1:0);
    });
    // recompute running balance
    var run = 0;
    merged.forEach(function(t){
      run = Math.round((run + (t.debit||0) - (t.credit||0))*100)/100;
      t.balance = run;
    });
    v.effectiveTxns = merged;
    v.effectiveTotalDebit = Math.round((acc.total_debit + extraTxns.reduce(function(s,t){return s+(t.debit||0);},0))*100)/100;
    v.effectiveTotalCredit = Math.round((acc.total_credit + extraTxns.reduce(function(s,t){return s+(t.credit||0);},0))*100)/100;
    var net = Math.round((v.effectiveTotalDebit - v.effectiveTotalCredit)*100)/100;
    v.effectiveBalance = acc.home === 'customer' ? net : -net;
    v.effectiveSettled = Math.abs(v.effectiveBalance) <= 170;
    // recompute aging with manual entries as 'dec' events
    v.effectiveAging = computeAging(merged, acc.home, v.effectiveBalance, v.effectiveSettled);
    v.manualCount = entries.length;
    return v;
  }

  function primaryCode(acc){
    // for merged accounts (acct_no is "aaa / bbb"), use the raw string as key so it's stable across reloads
    return acc.acct_no;
  }

  // FIFO aging mirroring the Python logic, then normalized to exact balance
  function computeAging(txns, home, balance, settled){
    var buckets = {'0-30':0,'31-60':0,'61-90':0,'90+':0};
    if(settled || balance <= 0) return buckets;
    var events = [];
    txns.forEach(function(t){
      if(home === 'customer'){
        if(t.debit != null) events.push({date:t.date_iso, amount:t.debit, kind:'inc'});
        else if(t.credit != null) events.push({date:t.date_iso, amount:t.credit, kind:'dec'});
      } else {
        if(t.credit != null) events.push({date:t.date_iso, amount:t.credit, kind:'inc'});
        else if(t.debit != null) events.push({date:t.date_iso, amount:t.debit, kind:'dec'});
      }
    });
    var queue = []; var deficit = 0;
    events.forEach(function(ev){
      if(ev.kind === 'inc'){
        var amt = ev.amount;
        if(deficit > 1e-9){ var pay = Math.min(deficit, amt); deficit -= pay; amt -= pay; }
        if(amt > 1e-9) queue.push([ev.date, amt]);
      } else {
        var rem = ev.amount;
        for(var i=0;i<queue.length;i++){
          if(rem <= 1e-9) break;
          var take = Math.min(queue[i][1], rem);
          queue[i][1] -= take; rem -= take;
        }
        if(rem > 1e-9) deficit += rem;
      }
    });
    var report = parseReportDate();
    queue.forEach(function(q){
      var rem = q[1]; if(rem <= 0.005 || !q[0]) return;
      var d = new Date(q[0]);
      var age = Math.round((report - d) / 86400000);
      if(age <= 30) buckets['0-30'] += rem;
      else if(age <= 60) buckets['31-60'] += rem;
      else if(age <= 90) buckets['61-90'] += rem;
      else buckets['90+'] += rem;
    });
    // normalize to exact balance
    var sum = buckets['0-30']+buckets['31-60']+buckets['61-90']+buckets['90+'];
    var diff = balance - sum;
    if(Math.abs(diff) > 0.005){
      var largest = '0-30';
      ['31-60','61-90','90+'].forEach(function(k){ if(buckets[k] > buckets[largest]) largest = k; });
      if(sum === 0) largest = '90+';
      buckets[largest] += diff;
    }
    Object.keys(buckets).forEach(function(k){ buckets[k] = Math.round(buckets[k]); });
    return buckets;
  }
  function parseReportDate(){
    // meta.period_to is dd/mm/yyyy
    var p = DATA.meta.period_to.split('/');
    return new Date(+p[2], +p[1]-1, +p[0]);
  }

  // ---------- storage (file:// safe) ----------
  function getStore(key, def){
    try{ var v = localStorage.getItem(key); return v===null?def:v; }catch(e){ return def; }
  }
  function setStore(key, val){
    try{ localStorage.setItem(key, val); }catch(e){ /* ignore, e.g. file:// */ }
  }

  // ---------- helpers ----------
  function fmt(n){
    n = Math.round(n||0);
    var neg = n < 0; n = Math.abs(n);
    var s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg?'-':'') + s;
  }
  function fmtDate(iso){
    if(!iso) return '';
    var d = iso.split('-');
    return d[2]+'/'+d[1]+'/'+d[0];
  }
  function esc(s){
    if(s===null||s===undefined) return '';
    return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
  }

  function partyList(){
    var raw = state.tab==='customers' ? DATA.customers : DATA.suppliers;
    return raw.map(effective);
  }
  function partyKpi(){
    // compute live KPIs from effective accounts so manual entries are reflected
    var list = partyList();
    var isCust = state.tab === 'customers';
    var total_debit = 0, total_credit = 0, outstanding = 0, prepaid = 0, settled_count = 0;
    list.forEach(function(a){
      total_debit += a.effectiveTotalDebit;
      total_credit += a.effectiveTotalCredit;
      if(a.effectiveSettled) settled_count++;
      else if(a.effectiveBalance > 0) outstanding += a.effectiveBalance;
      else prepaid += -a.effectiveBalance;
    });
    var rate = isCust ? (total_debit ? total_credit/total_debit*100 : 0)
                      : (total_credit ? total_debit/total_credit*100 : 0);
    var outAcc = list.filter(function(a){return !a.effectiveSettled && a.effectiveBalance>0;}).sort(function(a,b){return b.effectiveBalance-a.effectiveBalance;});
    var top5 = outAcc.slice(0,5).reduce(function(s,a){return s+a.effectiveBalance;},0);
    var concentration = outstanding ? top5/outstanding*100 : 0;
    return {
      total_debit: total_debit, total_credit: total_credit,
      outstanding: outstanding, prepaid: prepaid,
      settled_count: settled_count, total_count: list.length,
      rate: Math.round(rate*10)/10, concentration: Math.round(concentration*10)/10,
      top_name: outAcc[0] ? outAcc[0].acct_name : null,
      top_amount: outAcc[0] ? outAcc[0].effectiveBalance : 0
    };
  }
  function partyLabel(){ return state.tab==='customers' ? 'العميل' : 'المورد'; }
  function partyLabelPl(){ return state.tab==='customers' ? 'عملاء' : 'موردين'; }

  // ---------- sort ----------
  function groupOf(a){
    if(a.effectiveSettled) return 1;
    return a.effectiveBalance > 0 ? 0 : 2;
  }
  function sortAccounts(list){
    return list.slice().sort(function(a,b){
      var ga = groupOf(a), gb = groupOf(b);
      if(ga !== gb) return ga - gb;
      if(ga === 0) return b.effectiveBalance - a.effectiveBalance;
      if(ga === 2) return Math.abs(a.effectiveBalance) - Math.abs(b.effectiveBalance);
      return a.acct_name.localeCompare(b.acct_name, 'ar');
    });
  }

  // ---------- KPI + insight ----------
  function renderKpis(){
    var k = partyKpi();
    var isCust = state.tab === 'customers';
    var rateLbl = isCust ? 'معدل التحصيل' : 'معدل السداد';
    var volLbl = isCust ? 'إجمالي المبيعات (شامل الضريبة)' : 'إجمالي المشتريات (شامل الضريبة)';
    var subVol = isCust ? ('محصّل: ' + fmt(k.total_credit) + ' ر.س') : ('مسدّد: ' + fmt(k.total_debit) + ' ر.س');
    var html = '';
    html += '<div class="kpi"><div class="lbl">صافي الرصيد '+(isCust?'المستحق على العملاء':'المستحق للموردين')+'</div>' +
            '<div class="val">'+fmt(k.outstanding)+' <span style="font-size:12px;color:var(--text-faint)">ر.س</span></div>' +
            (k.prepaid>0? '<div class="sub">+ '+fmt(k.prepaid)+' ر.س دفعات مقدمة غير مقاصّة</div>':'<div class="sub">لا توجد دفعات مقدمة معلّقة</div>') + '</div>';
    html += '<div class="kpi"><div class="lbl">'+rateLbl+' (بالقيمة)</div><div class="val">'+k.rate+'%</div>' +
            '<div class="bar"><i style="width:'+Math.min(k.rate,100)+'%"></i></div></div>';
    html += '<div class="kpi"><div class="lbl">'+volLbl+' خلال الفترة</div><div class="val">'+fmt(isCust?k.total_debit:k.total_credit)+'</div>' +
            '<div class="sub">'+subVol+'</div></div>';
    html += '<div class="kpi'+(k.concentration>=60?' warn':'')+'"><div class="lbl">الحسابات المسددة بالكامل</div>' +
            '<div class="val">'+k.settled_count+' <span style="font-size:13px;color:var(--text-faint)">/ '+k.total_count+'</span></div>' +
            '<div class="sub">تركّز أكبر 5 '+partyLabelPl()+': '+k.concentration+'%</div></div>';
    document.getElementById('kpis').innerHTML = html;

    var ins = document.getElementById('insightBox');
    if(k.top_name){
      var risky = k.concentration >= 60;
      ins.innerHTML = '<div class="insight'+(risky?' risk':'')+'">' +
        (risky?'⚠️ ':'💡 ') +
        'أكبر جهة قائمة حالياً: <b>'+esc(k.top_name)+'</b> بمبلغ <b>'+fmt(k.top_amount)+' ر.س</b>' +
        (risky? ' — تركّز أكبر 5 '+partyLabelPl()+' يمثل <b>'+k.concentration+'%</b> من إجمالي الرصيد القائم، وهذا تركّز مرتفع يستحق المتابعة.' : '.') +
        '</div>';
    } else { ins.innerHTML = ''; }
  }

  // ---------- aging mini bar ----------
  var AGE_COLORS = ['#1e8a5f','#b7791f','#c0781f','#c0392b'];
  var AGE_KEYS = ['0-30','31-60','61-90','90+'];
  function agingBarHtml(aging, total){
    if(!total || total<=0) return '';
    var segs = '';
    for(var i=0;i<AGE_KEYS.length;i++){
      var v = aging[AGE_KEYS[i]]||0;
      if(v<=0) continue;
      var pct = (v/total*100).toFixed(1);
      segs += '<span style="width:'+pct+'%;background:'+AGE_COLORS[i]+'" title="'+AGE_KEYS[i]+' يوم: '+fmt(v)+' ر.س"></span>';
    }
    return '<div class="aging"><div class="bar2">'+segs+'</div></div>';
  }
  function agingDetailHtml(acc){
    var aging = acc.effectiveAging || acc.aging;
    var total = AGE_KEYS.reduce(function(s,k){return s+(aging[k]||0);},0);
    if(acc.effectiveSettled || acc.effectiveBalance<=0 || total<=0) return '';
    var chips = AGE_KEYS.map(function(k,i){
      var v = aging[k]||0;
      var pct = total>0 ? Math.round(v/total*100) : 0;
      return '<div class="age-chip"><span class="dot" style="background:'+AGE_COLORS[i]+'"></span>' +
             '<div><div class="age-lbl">'+k+' يوم</div><div class="age-val">'+fmt(v)+' ر.س <span class="age-pct">('+pct+'%)</span></div></div></div>';
    }).join('');
    return '<div class="aging-detail"><div class="aging-detail-title">📊 تقادم الرصيد القائم (Aging)</div><div class="age-chips">'+chips+'</div></div>';
  }

  // ---------- statement table ----------
  function buildStatementRows(acc, forPrint){
    var txns = acc.effectiveTxns || acc.txns;
    var totalDebit = acc.effectiveTotalDebit != null ? acc.effectiveTotalDebit : acc.total_debit;
    var totalCredit = acc.effectiveTotalCredit != null ? acc.effectiveTotalCredit : acc.total_credit;
    var settled = acc.effectiveSettled != null ? acc.effectiveSettled : acc.settled;
    var balance = acc.effectiveBalance != null ? acc.effectiveBalance : acc.balance;
    var rows = '';
    rows += '<tr class="opening"><td colspan="2">رصيد افتتاحي (' + esc(DATA.meta.period_from) + ')</td><td class="num">-</td><td class="num">-</td><td class="num">0</td></tr>';
    txns.forEach(function(t){
      var descHtml = esc(t.desc);
      if(t.manual && !forPrint){
        descHtml += '<span class="pill-manual">مضاف يدوياً</span>' +
                    ' <button class="reset-manual" data-remove="'+esc(t.manual_id)+'" title="إزالة">✕</button>';
      }
      rows += '<tr'+(t.manual ? ' class="manual"' : '')+'>' +
        '<td>'+esc(t.date)+'</td>' +
        '<td class="desc">'+descHtml+'</td>' +
        '<td class="num">'+(t.debit!=null?fmt(t.debit):'-')+'</td>' +
        '<td class="num">'+(t.credit!=null?fmt(t.credit):'-')+'</td>' +
        '<td class="num">'+fmt(t.balance)+'</td>' +
      '</tr>';
    });
    var netForClose = totalDebit - totalCredit;
    var closeLbl = settled ? 'مسدد بالكامل ✓' : (balance>0 ? 'رصيد ختامي' : 'دفعة مقدمة (رصيد دائن)');
    rows += '<tr class="closing"><td colspan="4">الرصيد الختامي (' + esc(DATA.meta.period_to) + ') — '+closeLbl+'</td>' +
            '<td class="num">'+fmt(netForClose)+'</td></tr>';
    return rows;
  }

  function statementSummarySentence(acc){
    var settled = acc.effectiveSettled != null ? acc.effectiveSettled : acc.settled;
    var balance = acc.effectiveBalance != null ? acc.effectiveBalance : acc.balance;
    if(settled) return 'لا يوجد رصيد مستحق — الحساب مسدد بالكامل.';
    if(balance>0){
      return state.tab==='customers'
        ? 'المبلغ المستحق على العميل: <b>'+fmt(balance)+' ر.س</b>'
        : 'المبلغ المستحق للمورد (علينا سداده): <b>'+fmt(balance)+' ر.س</b>';
    }
    return state.tab==='customers'
      ? 'رصيد دائن لصالح العميل (دفعة مقدمة): <b>'+fmt(Math.abs(balance))+' ر.س</b>'
      : 'دفعة مقدمة منا للمورد (رصيد لنا): <b>'+fmt(Math.abs(balance))+' ر.س</b>';
  }

  // ---------- print ----------
  function printStatement(acc){
    var area = document.getElementById('printArea');
    var summary = statementSummarySentence(acc).replace(/<\/?b>/g,'');
    var rows = buildStatementRows(acc, true);
    area.innerHTML =
      '<div class="print-doc">' +
      '<div class="print-hd"><div><h2>'+esc(DATA.meta.company)+'</h2>' +
      '<div>الرقم الضريبي '+esc(DATA.meta.tax_no)+'</div></div>' +
      '<div style="text-align:left"><h3>كشف حساب</h3><div>تاريخ الإصدار: '+esc(DATA.meta.generated)+'</div></div></div>' +
      '<div class="print-meta">' +
        '<div><b>'+partyLabel()+':</b> '+esc(acc.acct_name)+'</div>' +
        '<div><b>رقم الحساب:</b> '+esc(acc.acct_no)+'</div>' +
        '<div><b>الفترة:</b> '+esc(DATA.meta.period_from)+' – '+esc(DATA.meta.period_to)+'</div>' +
      '</div>' +
      '<table class="stm print-table"><thead><tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead>' +
      '<tbody>'+rows+'</tbody></table>' +
      '<div class="print-summary">'+summary+'</div>' +
      '<div class="print-ftr">شركة التكعيب المعماري — الأرقام بالريال السعودي</div>' +
      '</div>';
    window.print();
  }

  // ---------- render list ----------
  function matchesSearch(a){
    if(!state.q) return true;
    var q = state.q.trim();
    return a.acct_name.indexOf(q) !== -1 || a.acct_no.indexOf(q) !== -1;
  }
  function matchesFilter(a){
    if(state.filter==='all') return true;
    if(state.filter==='settled') return a.effectiveSettled;
    if(state.filter==='outstanding') return !a.effectiveSettled && a.effectiveBalance>0;
    if(state.filter==='prepaid') return !a.effectiveSettled && a.effectiveBalance<0;
    return true;
  }

  function renderList(){
    var listEl = document.getElementById('list');
    var emptyEl = document.getElementById('emptyMsg');
    var raw = partyList().filter(matchesSearch).filter(matchesFilter);
    var sorted = sortAccounts(raw);
    document.getElementById('countPill').textContent = 'عرض '+sorted.length+' من '+partyList().length;

    if(sorted.length===0){
      listEl.innerHTML = ''; emptyEl.style.display='block'; return;
    }
    emptyEl.style.display='none';

    var html = sorted.map(function(a, idx){
      var badgeHtml, amtCls='';
      if(a.effectiveSettled){ badgeHtml = '<span class="badge settled">✓ مسدد بالكامل</span>'; }
      else if(a.effectiveBalance>0){ badgeHtml = '<span class="badge outstanding">قائم</span>'; }
      else { badgeHtml = '<span class="badge prepaid">دفعة مقدمة</span>'; }
      if(a.merged) {
        var mTitle = a.merge_type==='dual_role' ? 'حساب موحّد بعد تصفية دوره كعميل ومورد' : 'حساب موحّد لأكواد مكررة بنفس الاسم';
        badgeHtml += '<span class="badge dual" title="'+esc(mTitle+': '+a.merged_codes.join(' + '))+'">🔗 '+(a.merge_type==='dual_role'?'دور مزدوج — مُصفّى':'حساب مكرر — موحّد')+'</span>';
      }
      if(a.manualCount>0){
        badgeHtml += '<span class="badge dual" title="عدد الحركات اليدوية">+ '+a.manualCount+' يدوي</span>';
      }

      var aging = a.effectiveAging || a.aging;
      var total = AGE_KEYS.reduce(function(s,k){return s+(aging[k]||0);},0);
      var amtColor = a.effectiveSettled ? 'var(--green)' : (a.effectiveBalance>0 ? 'var(--text)' : 'var(--purple)');
      var amtLbl = a.effectiveSettled ? 'مسدد' : (a.effectiveBalance>0 ? (state.tab==='customers'?'مستحق':'مستحق علينا') : 'مقدم');
      var totalTxnCount = a.effectiveTxns ? a.effectiveTxns.length : a.txn_count;
      var lastDateIso = a.last_date;
      if(a.effectiveTxns){
        a.effectiveTxns.forEach(function(t){ if(t.date_iso && (!lastDateIso || t.date_iso > lastDateIso)) lastDateIso = t.date_iso; });
      }

      return '<div class="card" data-id="'+esc(a.acct_no)+'">' +
        '<div class="row" data-id="'+esc(a.acct_no)+'">' +
          '<div class="idx">'+(idx+1)+'</div>' +
          '<div class="info"><div class="name">'+esc(a.acct_name)+' '+badgeHtml+'</div>' +
          '<div class="code">'+esc(a.acct_no)+' · '+totalTxnCount+' حركة'+(lastDateIso?(' · آخر حركة '+fmtDate(lastDateIso)):'')+'</div></div>' +
          agingBarHtml(aging, total) +
          '<div class="amt"><div class="num" style="color:'+amtColor+'">'+fmt(Math.abs(a.effectiveBalance))+'</div><div class="lbl2">'+amtLbl+'</div></div>' +
          '<div class="chev">◀</div>' +
        '</div>' +
        '<div class="statement" data-holder="'+esc(a.acct_no)+'"></div>' +
      '</div>';
    }).join('');
    listEl.innerHTML = html;

    listEl.querySelectorAll('.row').forEach(function(rowEl){
      rowEl.addEventListener('click', function(){
        var id = rowEl.getAttribute('data-id');
        var card = listEl.querySelector('.card[data-id="'+cssEscape(id)+'"]');
        var willOpen = !card.classList.contains('open');
        card.classList.toggle('open');
        if(willOpen){
          buildStatementPanel(card, id);
        }
      });
    });
  }

  function buildStatementPanel(card, id){
    var acc = partyList().find(function(x){return x.acct_no===id;});
    if(!acc) return;
    var holder = card.querySelector('.statement');
    var isCust = state.tab === 'customers';
    var entryLbl = isCust ? 'تحصيل من العميل' : 'دفعة للمورد';
    holder.innerHTML =
      '<div class="stm-head">' +
        '<div class="meta">'+statementSummarySentence(acc)+'</div>' +
        '<button class="dlbtn" type="button">🖨️ طباعة كشف الحساب PDF</button>' +
      '</div>' +
      agingDetailHtml(acc) +
      '<div class="add-entry">' +
        '<div class="add-entry-title">➕ إضافة '+entryLbl+' جديد</div>' +
        '<div class="add-entry-row">' +
          '<input type="date" class="date-in" value="'+todayInput()+'">' +
          '<input type="number" class="amt-in" placeholder="المبلغ (ر.س)" step="1" min="0">' +
          '<input type="text" class="desc-in" placeholder="'+(isCust?'مثال: تحصيل نقدي / شيك رقم ...':'مثال: دفعة نقدية / تحويل بنكي ...')+'">' +
          '<button class="add-btn" type="button">إضافة</button>' +
        '</div>' +
        '<div class="add-note">تُخزَّن الحركات اليدوية في هذا المتصفح فقط وتنعكس فوراً على الرصيد والتقادم وكشف الطباعة.</div>' +
      '</div>' +
      '<div class="stm-table-wrap"><table class="stm"><thead><tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead>' +
      '<tbody>'+buildStatementRows(acc,false)+'</tbody></table></div>';
    holder.querySelector('.dlbtn').addEventListener('click', function(e){
      e.stopPropagation();
      var freshAcc = partyList().find(function(x){return x.acct_no===id;});
      printStatement(freshAcc);
    });
    holder.querySelector('.add-btn').addEventListener('click', function(e){
      e.stopPropagation();
      var dateIn = holder.querySelector('.date-in').value;
      var amtIn = parseFloat(holder.querySelector('.amt-in').value);
      var descIn = holder.querySelector('.desc-in').value.trim();
      var parsed = parseDateInput(dateIn);
      if(!parsed){ alert('تاريخ غير صالح'); return; }
      if(!(amtIn > 0)){ alert('أدخل مبلغاً أكبر من صفر'); return; }
      var defaultDesc = state.tab==='customers' ? 'تحصيل (يدوي)' : 'دفعة (يدوية)';
      addEntry(id, { date_iso: parsed.iso, date_disp: parsed.disp,
                     amount: Math.round(amtIn), desc: descIn || defaultDesc });
      // refresh both the row (aging/badges) and the panel content
      renderList();
      var newCard = document.querySelector('.card[data-id="'+cssEscape(id)+'"]');
      if(newCard){ newCard.classList.add('open'); buildStatementPanel(newCard, id); if(newCard.scrollIntoView) newCard.scrollIntoView({behavior:"smooth", block:"nearest"}); }
      renderKpis();
    });
    holder.querySelectorAll('.reset-manual').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var mid = btn.getAttribute('data-remove');
        if(!confirm('إزالة هذه الحركة اليدوية؟')) return;
        removeEntry(id, mid);
        renderList();
        var newCard = document.querySelector('.card[data-id="'+cssEscape(id)+'"]');
        if(newCard){ newCard.classList.add('open'); buildStatementPanel(newCard, id); }
        renderKpis();
      });
    });
  }

  // ---------- events ----------
  function renderAll(){ renderKpis(); renderList(); }

  document.getElementById('tabs').addEventListener('click', function(e){
    var t = e.target.closest('.tab');
    if(!t) return;
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    t.classList.add('active');
    state.tab = t.getAttribute('data-tab');
    state.filter = 'all';
    document.querySelectorAll('#filterSeg button').forEach(function(b){b.classList.toggle('active', b.getAttribute('data-f')==='all');});
    renderAll();
  });

  document.getElementById('searchInput').addEventListener('input', function(e){
    state.q = e.target.value; renderList();
  });

  document.getElementById('filterSeg').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if(!b) return;
    document.querySelectorAll('#filterSeg button').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');
    state.filter = b.getAttribute('data-f');
    renderList();
  });

  function applyDark(dark){
    document.documentElement.classList.toggle('dark', dark);
    document.getElementById('darkToggle').textContent = dark ? '☀️' : '🌙';
  }
  document.getElementById('darkToggle').addEventListener('click', function(){
    var dark = !document.documentElement.classList.contains('dark');
    applyDark(dark);
    setStore('atk_dark', dark ? '1' : '0');
  });

  // init
  var brandEl = document.getElementById('brandName');
  if(brandEl && DATA.meta && DATA.meta.company) brandEl.textContent = DATA.meta.company;
  applyDark(getStore('atk_dark','0')==='1');
  renderAll();
})();

</script>
</body>
</html>
